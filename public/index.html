<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>감정렌즈 — AI 감성 분석</title>
  <meta name="description" content="문장을 입력하면 AI가 긍정·부정·중립과 신뢰도, 판단 이유를 알려드립니다.">
  <meta name="theme-color" content="#08090a">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="brand">
        <svg class="brand-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="3"/>
          <circle cx="16" cy="16" r="5" fill="#4cb782"/>
        </svg>
        <span>감정렌즈</span>
      </div>
      <nav class="header-nav">
        <a href="#analyzer" class="nav-link">사용 방법</a>
        <a href="#notice" class="nav-link">안내</a>
        <button id="start-btn" type="button" class="btn btn--primary btn--sm">분석 시작</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1 class="hero-title">문장 속 감정을<br>한 번에 읽어내는 AI</h1>
      <div class="hero-desc-wrap">
        <p class="hero-desc">텍스트를 입력하면 긍정·부정·중립과 신뢰도, 판단 이유를 알려드려요.</p>
        <a href="#analyzer" class="hero-link">
          <span class="hero-badge">New</span>
          <span>예시로 체험하기 →</span>
        </a>
      </div>
    </section>

    <section id="analyzer" class="app-frame">
      <!-- 입력 패널 -->
      <div class="panel panel--input">
        <div class="panel-header">
          <div class="panel-title-wrap">
            <svg class="panel-header-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M8 15A7 7 0 1 0 8 1v14zm0 1A8 8 0 1 1 8 0a8 8 0 0 1 0 16z"/>
            </svg>
            <span>새 분석</span>
          </div>
          <span id="char-count" class="char-count">0 / 1,000</span>
        </div>

        <div class="panel-body">
          <label for="input-text" class="input-label">분석할 문장</label>
          <textarea
            id="input-text"
            class="textarea"
            rows="6"
            maxlength="1000"
            placeholder="예) 오늘 받은 택배 포장이 꼼꼼해서 기분이 좋았어요."
          ></textarea>

          <div class="examples-wrap">
            <span class="examples-caption">예시</span>
            <button type="button" class="chip" data-example="positive">
              <span class="chip-dot chip-dot--positive" aria-hidden="true"></span>
              긍정 예시
            </button>
            <button type="button" class="chip" data-example="negative">
              <span class="chip-dot chip-dot--negative" aria-hidden="true"></span>
              부정 예시
            </button>
            <button type="button" class="chip" data-example="neutral">
              <span class="chip-dot chip-dot--neutral" aria-hidden="true"></span>
              중립 예시
            </button>
          </div>
        </div>

        <div class="panel-footer">
          <span id="shortcut-hint" class="shortcut-hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd>로 분석</span>
          <div class="action-buttons">
            <button id="clear-btn" type="button" class="btn btn--ghost">지우기</button>
            <button id="analyze-btn" type="button" class="btn btn--primary" disabled>
              <span class="spinner" aria-hidden="true" hidden></span>
              <span class="btn-text">분석하기</span>
            </button>
          </div>
        </div>
      </div>

      <!-- 결과 패널 -->
      <div class="panel panel--result" aria-live="polite">
        <div class="panel-header">
          <div class="panel-title-wrap">
            <svg class="panel-header-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2"/>
              <circle cx="8" cy="8" r="2"/>
            </svg>
            <span>분석 결과</span>
          </div>
          <span class="panel-badge">OpenAI</span>
        </div>

        <div class="panel-body">
          <!-- 빈 상태 -->
          <div id="result-empty" class="result-state result-empty">
            <svg class="empty-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
              <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2"/>
              <circle cx="16" cy="16" r="4"/>
            </svg>
            <p class="empty-title">아직 분석한 문장이 없어요</p>
            <p class="empty-desc">문장을 입력하고 분석하기를 눌러 보세요.</p>
          </div>

          <!-- 로딩 상태 -->
          <div id="result-loading" class="result-state result-loading" hidden>
            <div class="skeleton-bar skeleton-bar-1"></div>
            <div class="skeleton-bar skeleton-bar-2"></div>
            <div class="skeleton-bar skeleton-bar-3"></div>
            <p class="loading-text">AI가 문장을 읽고 있어요…</p>
          </div>

          <!-- 성공 결과 카드 -->
          <div id="result-success" class="result-state result-success" hidden>
            <div id="sentiment-badge" class="badge">
              <span class="badge-dot" aria-hidden="true"></span>
              <span id="sentiment-label"></span>
            </div>

            <div class="result-section">
              <span class="section-caption">신뢰도</span>
              <div class="confidence-row">
                <span id="confidence-value" class="confidence-value"></span>
                <span id="confidence-label" class="confidence-label"></span>
              </div>
              <div id="confidence-bar" class="confidence-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div id="confidence-fill" class="confidence-fill"></div>
              </div>
            </div>

            <div class="result-section">
              <span class="section-caption">분석 이유</span>
              <p id="reason-text" class="reason-text"></p>
            </div>
          </div>

          <!-- 오류 카드 -->
          <div id="result-error" class="result-state result-error" role="alert" hidden>
            <div class="error-header">
              <svg class="error-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 3.5a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 8 4.5zm0 7a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5z"/>
              </svg>
              <h2 id="error-title" class="error-title"></h2>
            </div>
            <p id="error-message" class="error-message"></p>
            <p id="error-code" class="error-code"></p>
          </div>
        </div>
      </div>
    </section>

    <footer id="notice" class="site-footer">
      <p class="footer-text">AI 분석 결과는 참고용이며 정확하지 않을 수 있어요.</p>
      <p class="footer-text">입력한 문장은 저장되지 않으며, 분석을 위해 OpenAI로 전송됩니다.</p>
    </footer>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
